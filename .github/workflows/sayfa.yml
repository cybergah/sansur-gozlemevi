# Her sabah OONI'nin Türkiye ölçümlerini toplar, olası engelleri Türkiye dışından
# (GitHub sunucusu) yeniden dener ve sayfayı yayınlar. Kod gönderilince yalnızca yayınlar.
name: Sayfa

on:
  schedule:
    - cron: "30 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Kurulum
        run: python -m pip install -q -r requirements.txt jsonschema

      - name: OONI verisini topla
        if: github.event_name != 'push'
        run: |
          # Çıkış 3: o gün yeterli veri yok, eski sonuç yayında kalır.
          python ooni.py || [ $? -eq 3 ]

      - name: Veri şemaya uyuyor mu
        run: python dogrula.py

      - name: Yeni veriyi kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/durum.json veri/gunluk
          if ! git diff --cached --quiet; then
            git commit -q -m "Veri $(date -u +%F) (OONI)"
            git push -q
          fi

      - name: Karşı kontrol
        run: |
          python kontrol.py veri/durum.json site/kontrol.json
          python dogrula.py --kontrol site/kontrol.json

      - name: Sayfa dosyaları
        run: cp veri/durum.json site/durum.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
