# Yeni ölçüm gönderilince engelli görünen siteleri Türkiye dışından (GitHub sunucusu)
# yeniden dener ve sayfayı yayınlar.
name: Sayfa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Veri şemaya uyuyor mu
        run: |
          python -m pip install -q -r requirements.txt jsonschema
          python dogrula.py

      - name: Karşı kontrol
        run: |
          python kontrol.py veri/durum.json site/kontrol.json
          python dogrula.py --kontrol site/kontrol.json

      - name: Sayfa dosyaları
        run: cp veri/durum.json site/durum.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
